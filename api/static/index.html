<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL-Shortener — Shorten Your Links</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>
    <div class="grain"></div>

    <div class="sparkle absolute top-[18%] left-[12%] z-10 hidden sm:block">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 2L13.7 10.3L22 12L13.7 13.7L12 22L10.3 13.7L2 12L10.3 10.3L12 2Z"
          fill="#D9A4AF"
          opacity=".7"
        />
      </svg>
    </div>

    <div
      class="sparkle-two absolute top-[28%] right-[13%] z-10 hidden sm:block"
    >
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 2L13.7 10.3L22 12L13.7 13.7L12 22L10.3 13.7L2 12L10.3 10.3L12 2Z"
          fill="#B9A9D8"
          opacity=".7"
        />
      </svg>
    </div>

    <main
      class="relative z-10 min-h-screen w-full flex items-center justify-center px-4 py-10 sm:py-16"
    >
      <div class="w-full max-w-[470px]">
        <div class="text-center mb-7">
          <div class="inline-flex items-center gap-2.5 mb-5">
            <div
              class="relative flex h-10 w-10 items-center justify-center rounded-[14px] bg-white border border-stone-200/80 shadow-sm"
            >
              <div
                class="absolute inset-1.5 rounded-[10px] bg-gradient-to-br from-rose-100 to-rose-50"
              ></div>
              <svg
                class="relative w-[19px] h-[19px] text-[#c67d8c]"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M13.828 10.172a4 4 0 0 0-5.656 0l-4 4a4 4 0 1 0 5.656 5.656l1.102-1.101m-.758-4.899a4 4 0 0 0 5.656 0l4-4a4 4 0 0 0-5.656-5.656l-1.1 1.1"
                />
              </svg>
            </div>
            <span
              class="text-[17px] font-semibold tracking-[-0.03em] text-stone-800"
              >URL-Shortener</span
            >
          </div>
          <h1
            class="text-[34px] sm:text-[39px] leading-[1.1] tracking-[-0.045em] font-semibold text-stone-900"
          >
            A little link
            <span class="serif italic font-medium text-[#c98594]">magic.</span>
          </h1>
          <p
            class="mt-3 text-[14px] leading-6 text-stone-500 max-w-[350px] mx-auto"
          >
            Turn long, messy URLs into beautiful little links that are easy to
            share.
          </p>
        </div>

        <section
          class="main-card relative overflow-hidden rounded-[30px] border border-white/80 bg-white/75 backdrop-blur-2xl p-5 sm:p-7"
        >
          <div
            class="absolute -top-24 -right-24 w-48 h-48 rounded-full bg-rose-100/40 blur-3xl pointer-events-none"
          ></div>

          <form id="shortenForm" class="relative space-y-5">
            <div>
              <div class="flex items-center justify-between mb-2">
                <label
                  for="urlInput"
                  class="text-[11px] font-semibold uppercase tracking-[0.13em] text-stone-500"
                  >Destination</label
                >
                <span
                  class="flex items-center gap-1.5 text-[10px] text-stone-400"
                >
                  <span class="w-1.5 h-1.5 rounded-full bg-[#b9cfbe]"></span>
                  Your URL stays yours
                </span>
              </div>
              <div class="relative">
                <div
                  class="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 pointer-events-none"
                >
                  <svg
                    class="w-[18px] h-[18px]"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.7"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M13.19 8.688l2.5-2.5a3.182 3.182 0 014.5 4.5l-4.5 4.5a3.182 3.182 0 01-4.5 0m.81-2.19l-2.5 2.5a3.182 3.182 0 11-4.5-4.5l4.5-4.5a3.182 3.182 0 014.5 0"
                    />
                  </svg>
                </div>
                <input
                  type="url"
                  id="urlInput"
                  required
                  autocomplete="url"
                  placeholder="https://your-long-url.com/..."
                  class="soft-input w-full rounded-2xl border border-stone-200/90 bg-stone-50/70 pl-11 pr-4 py-3.5 text-[13px] text-stone-800 outline-none placeholder:text-stone-300"
                />
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-2">
                <label
                  for="customShort"
                  class="text-[11px] font-semibold uppercase tracking-[0.13em] text-stone-500"
                  >Custom alias</label
                >
                <span class="text-[10px] text-stone-400">Optional</span>
              </div>
              <div class="relative">
                <div
                  class="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 pointer-events-none"
                >
                  <svg
                    class="w-[17px] h-[17px]"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.7"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"
                    />
                  </svg>
                </div>
                <input
                  type="text"
                  id="customShort"
                  autocomplete="off"
                  maxlength="60"
                  placeholder="e.g. my-portfolio"
                  class="soft-input w-full rounded-2xl border border-stone-200/90 bg-stone-50/70 pl-11 pr-4 py-3.5 text-[13px] text-stone-800 outline-none placeholder:text-stone-300"
                />
              </div>
            </div>

            <div
              class="flex items-center gap-2.5 rounded-2xl border border-stone-200/70 bg-[#fcfaf8] px-3.5 py-3"
            >
              <div
                class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-[#f7eee9] text-[#c28d78]"
              >
                <svg
                  class="w-4 h-4"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="1.7"
                >
                  <circle cx="12" cy="12" r="9"></circle>
                  <path stroke-linecap="round" d="M12 7v5l3 2"></path>
                </svg>
              </div>
              <div class="min-w-0">
                <p class="text-[11px] font-semibold text-stone-700">
                  Temporary by design
                </p>
                <p class="text-[10px] text-stone-400 mt-0.5">
                  Your short link expires after 24 hours.
                </p>
              </div>
              <div
                class="ml-auto shrink-0 rounded-full bg-white border border-stone-200 px-2.5 py-1 text-[10px] font-semibold text-stone-500"
              >
                24h
              </div>
            </div>

            <button
              type="submit"
              id="submitBtn"
              class="create-button group relative flex w-full items-center justify-center gap-2 rounded-2xl py-3.5 text-[13px] font-semibold text-white cursor-pointer"
            >
              <span id="buttonContent" class="flex items-center gap-2">
                Create my link
                <svg
                  class="w-4 h-4 transition-transform duration-200 group-hover:translate-x-0.5"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M5 12h14m-6-6l6 6-6 6"
                  />
                </svg>
              </span>
            </button>
          </form>

          <div id="resultBox" class="hidden mt-5">
            <div
              class="result-enter rounded-[23px] border border-emerald-100/80 bg-gradient-to-br from-[#f4faf5] to-[#fbfaf7] p-4"
            >
              <div class="flex items-start gap-3">
                <div
                  class="success-icon flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-white border border-emerald-100 shadow-sm"
                >
                  <svg
                    class="w-4.5 h-4.5 text-emerald-500"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M5 13l4 4L19 7"
                    />
                  </svg>
                </div>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center justify-between gap-3">
                    <div>
                      <p class="text-[12px] font-semibold text-stone-800">
                        Your link is ready
                      </p>
                      <p class="text-[10px] text-stone-400 mt-0.5">
                        Beautifully short. Ready to share.
                      </p>
                    </div>
                    <span
                      id="expiryInfo"
                      class="shrink-0 rounded-full bg-white/80 border border-stone-200/70 px-2.5 py-1 text-[9px] font-semibold text-stone-400"
                    ></span>
                  </div>
                </div>
              </div>

              <div
                class="mt-4 flex items-center gap-2 rounded-2xl border border-stone-200/70 bg-white p-1.5 pl-3 shadow-sm"
              >
                <a
                  id="shortenedLink"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="min-w-0 flex-1 truncate text-[13px] font-semibold text-[#c77e8d] hover:text-[#b96f7e] hover:underline transition"
                ></a>
                <button
                  type="button"
                  onclick="copyLink()"
                  id="copyBtn"
                  class="shrink-0 rounded-xl bg-stone-100 px-3.5 py-2 text-[10px] font-semibold text-stone-600 transition hover:bg-stone-200 cursor-pointer"
                >
                  Copy
                </button>
              </div>

              <div class="mt-3 flex items-center justify-between px-1">
                <span
                  class="flex items-center gap-1.5 text-[9px] text-stone-400"
                >
                  <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
                  Active now
                </span>
                <span
                  id="rateLimitInfo"
                  class="text-[9px] text-stone-400"
                ></span>
              </div>
            </div>
          </div>

          <div
            id="errorBox"
            role="alert"
            class="hidden mt-4 rounded-2xl border border-rose-100 bg-rose-50/80 px-4 py-3 text-center text-[11px] font-medium text-rose-600"
          ></div>
        </section>
      </div>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
